name: Windows build check

# Проверочная сборка Windows без создания релиза. Запускается вручную и при
# изменении сборочных файлов, чтобы ловить регрессии до выпуска тега.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - run: flutter --version
      - run: flutter pub get

      # См. release.yml: снимаем невалидный ключ DEPENDS из CMakeLists плагина
      # flutter_inappwebview_windows, чтобы новые CMake (CMP0175) не падали.
      - name: Patch flutter_inappwebview_windows CMakeLists (CMP0175)
        shell: pwsh
        run: |
          $root = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA 'Pub\Cache' }
          Write-Host "PUB_CACHE root: $root"
          $files = Get-ChildItem -Path $root -Recurse -Filter CMakeLists.txt -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'flutter_inappwebview_windows' }
          if (-not $files) { Write-Error 'CMakeLists.txt плагина не найден в pub-cache'; exit 1 }
          foreach ($f in $files) {
            $c = Get-Content -LiteralPath $f.FullName -Raw
            $patched = $c -replace '(?m)^[ \t]*DEPENDS[ \t]+\$\{NUGET\}[ \t]*\r?\n', ''
            if ($patched -ne $c) {
              Set-Content -LiteralPath $f.FullName -Value $patched -NoNewline
              Write-Host "Patched: $($f.FullName)"
            } else {
              Write-Host "Nothing to patch: $($f.FullName)"
            }
          }

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "$env:GITHUB_WORKSPACE/hh_copilot-windows-check.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-check
          path: hh_copilot-windows-check.zip
          if-no-files-found: error
