name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build macOS
        run: |
          flutter build macos --release
          ditto -c -k --keepParent \
            build/macos/Build/Products/Release/hh_copilot.app \
            "$GITHUB_WORKSPACE/hh_copilot-${{ env.RELEASE_TAG }}-macos.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hh·copilot ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: hh_copilot-${{ env.RELEASE_TAG }}-macos.zip
          body: |
            Первый релиз **hh·copilot** — десктоп-приложение для hh.ru: аналитика
            резюме, чаты, авто-отклики с ИИ (письма/тесты), авто-ответы
            работодателям, определение собеседований и уведомления в Telegram.

            ### macOS
            Скачайте `hh_copilot-*-macos.zip` (universal: Intel + Apple Silicon),
            распакуйте и запустите `hh_copilot.app`. Подпись ad-hoc: при первом
            запуске правый клик → «Открыть», либо
            `xattr -dr com.apple.quarantine hh_copilot.app`.

            Настройка ИИ/Telegram — внутри приложения. Подробнее — в README.

            _Windows-сборка появится позже (собирается на Windows/CI отдельно)._
